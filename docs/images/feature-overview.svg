<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GoldMonitor 功能一览</title>
  <desc id="desc">从行情获取、风险预警到持仓复盘的本地工作流示意图。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="1" stop-color="#c79735"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="124" cy="130" r="240" fill="#d9aa49" opacity="0.08"/>
  <circle cx="1480" cy="770" r="320" fill="#d9aa49" opacity="0.05"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <text x="120" y="140" fill="#f8fafc" font-size="66" font-weight="700">GoldMonitor</text>
    <text x="120" y="198" fill="#cbd5e1" font-size="28">本地优先的黄金行情监控、风险预警与持仓复盘工具</text>
    <g transform="translate(80 300)" filter="url(#shadow)">
      <rect width="400" height="410" rx="28" fill="#ffffff" fill-opacity="0.97"/>
      <rect x="0" y="0" width="400" height="12" rx="6" fill="url(#gold)"/>
      <circle cx="58" cy="72" r="22" fill="#f3dfaf"/>
      <path d="M47 74h22M58 63v22" stroke="#9a6d1d" stroke-width="4" stroke-linecap="round"/>
      <text x="96" y="80" fill="#182235" font-size="34" font-weight="700">行情监控</text>
      <text x="46" y="146" fill="#64748b" font-size="23">多源价格与汇率</text>
      <text x="46" y="184" fill="#64748b" font-size="23">数据状态与历史走势</text>
      <path d="M46 300 C100 246 145 306 196 244 S296 262 354 198" fill="none" stroke="#c99736" stroke-width="10" stroke-linecap="round"/>
      <path d="M46 350h308" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
      <path d="M46 350v-40M123 350v-78M200 350v-118M277 350v-60M354 350v-150" stroke="#d5ad5c" stroke-width="16" stroke-linecap="round"/>
    </g>
    <path d="M505 505h70" stroke="#d8b15d" stroke-width="6" stroke-linecap="round"/>
    <path d="M550 482l30 23-30 23" fill="none" stroke="#d8b15d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(600 300)" filter="url(#shadow)">
      <rect width="400" height="410" rx="28" fill="#ffffff" fill-opacity="0.97"/>
      <rect x="0" y="0" width="400" height="12" rx="6" fill="url(#gold)"/>
      <circle cx="58" cy="72" r="22" fill="#f3dfaf"/>
      <path d="M58 50c-12 13-17 23-17 33a17 17 0 0 0 34 0c0-10-5-20-17-33Z" fill="none" stroke="#9a6d1d" stroke-width="4" stroke-linejoin="round"/>
      <text x="96" y="80" fill="#182235" font-size="34" font-weight="700">风险预警</text>
      <text x="46" y="146" fill="#64748b" font-size="23">价格、波动与目标价</text>
      <text x="46" y="184" fill="#64748b" font-size="23">弹窗、邮件与 Webhook</text>
      <rect x="46" y="240" width="308" height="76" rx="16" fill="#fff7e4"/>
      <circle cx="82" cy="278" r="14" fill="#c99736"/>
      <text x="116" y="286" fill="#6b4c12" font-size="24" font-weight="600">预警规则已触发</text>
      <rect x="46" y="338" width="220" height="24" rx="12" fill="#e2e8f0"/>
      <rect x="46" y="338" width="154" height="24" rx="12" fill="#d5ad5c"/>
    </g>
    <path d="M1025 505h70" stroke="#d8b15d" stroke-width="6" stroke-linecap="round"/>
    <path d="M1070 482l30 23-30 23" fill="none" stroke="#d8b15d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1120 300)" filter="url(#shadow)">
      <rect width="400" height="410" rx="28" fill="#ffffff" fill-opacity="0.97"/>
      <rect x="0" y="0" width="400" height="12" rx="6" fill="url(#gold)"/>
      <circle cx="58" cy="72" r="22" fill="#f3dfaf"/>
      <path d="M47 82V60a11 11 0 0 1 22 0v22M47 73h22M69 63h10" fill="none" stroke="#9a6d1d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="80" fill="#182235" font-size="34" font-weight="700">持仓复盘</text>
      <text x="46" y="146" fill="#64748b" font-size="23">本地持仓、流水与盈亏</text>
      <text x="46" y="184" fill="#64748b" font-size="23">事件时间轴与分析历史</text>
      <rect x="46" y="242" width="308" height="124" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
      <text x="72" y="283" fill="#64748b" font-size="20">持仓市值</text>
      <text x="72" y="334" fill="#182235" font-size="36" font-weight="700">本地记录</text>
      <path d="M278 331l20-28 18 14 25-47" fill="none" stroke="#c99736" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
