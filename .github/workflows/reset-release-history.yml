name: Reset Release History

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reset-release-history:
    if: contains(github.event.head_commit.message, '重置版本为首个正式版')
    runs-on: ubuntu-latest

    steps:
      - name: Delete version releases and tags
        uses: actions/github-script@v7
        with:
          script: |
            const versionTagPattern = /^v\d+\.\d+\.\d+$/;
            const { owner, repo } = context.repo;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            for (const release of releases) {
              if (!versionTagPattern.test(release.tag_name || "")) continue;
              core.info(`Deleting release ${release.tag_name} (${release.id})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            }

            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner,
              repo,
              ref: "tags/v",
              per_page: 100,
            });
            for (const item of refs) {
              const tagName = item.ref.replace("refs/tags/", "");
              if (!versionTagPattern.test(tagName)) continue;
              core.info(`Deleting tag ${tagName}`);
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tagName}`,
              });
            }
