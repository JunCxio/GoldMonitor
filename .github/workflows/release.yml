name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Run checks
        shell: powershell
        run: |
          python -m py_compile app.py setup_gui.py tests\risk_contract_check.py tests\update_logic_check.py tests\startup_contract_check.py tests\frontend_asset_check.py tests\test_risk_analysis_module.py tests\test_market_data_module.py tests\test_settings_store_module.py tests\test_notifications_module.py tests\test_event_timeline_module.py tests\test_update_manager_module.py tests\test_platform_module.py tests\test_news_module.py tests\test_targets_module.py tests\test_support_files_module.py tests\test_desktop_ui_module.py
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\contract_checks.ps1
          python tests\risk_contract_check.py
          python tests\gold_cache_check.py
          python tests\price_fetch_with_cache_check.py
          python tests\fetch_status_check.py
          python tests\threshold_persistence_check.py
          python tests\socket_connect_check.py
          python tests\news_logic_check.py
          python tests\forex_cache_check.py
          python tests\startup_contract_check.py
          python tests\update_logic_check.py
          python tests\port_selection_check.py
          python tests\event_timeline_review_check.py
          python tests\engineering_foundation_check.py
          python tests\test_storage_modules.py
          python tests\test_risk_analysis_module.py
          python tests\test_market_data_module.py
          python tests\test_settings_store_module.py
          python tests\test_notifications_module.py
          python tests\test_event_timeline_module.py
          python tests\test_update_manager_module.py
          python tests\test_platform_module.py
          python tests\test_news_module.py
          python tests\test_targets_module.py
          python tests\test_support_files_module.py
          python tests\test_desktop_ui_module.py
          python tests\frontend_asset_check.py

      - name: Build Windows application
        shell: powershell
        run: pyinstaller --clean --noconfirm GoldMonitor.spec

      - name: Build Windows installer
        shell: powershell
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          & $iscc .\installer\GoldMonitor.iss

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/GoldMonitorSetup.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run checks
        run: |
          python -m py_compile app.py setup_gui.py tests/risk_contract_check.py tests/update_logic_check.py tests/startup_contract_check.py tests/frontend_asset_check.py tests/test_risk_analysis_module.py tests/test_market_data_module.py tests/test_settings_store_module.py tests/test_notifications_module.py tests/test_event_timeline_module.py tests/test_update_manager_module.py tests/test_platform_module.py tests/test_news_module.py tests/test_targets_module.py tests/test_support_files_module.py tests/test_desktop_ui_module.py
          python tests/risk_contract_check.py
          python tests/gold_cache_check.py
          python tests/price_fetch_with_cache_check.py
          python tests/fetch_status_check.py
          python tests/threshold_persistence_check.py
          python tests/socket_connect_check.py
          python tests/news_logic_check.py
          python tests/forex_cache_check.py
          python tests/startup_contract_check.py
          python tests/update_logic_check.py
          python tests/port_selection_check.py
          python tests/event_timeline_review_check.py
          python tests/engineering_foundation_check.py
          python tests/test_storage_modules.py
          python tests/test_risk_analysis_module.py
          python tests/test_market_data_module.py
          python tests/test_settings_store_module.py
          python tests/test_notifications_module.py
          python tests/test_event_timeline_module.py
          python tests/test_update_manager_module.py
          python tests/test_platform_module.py
          python tests/test_news_module.py
          python tests/test_targets_module.py
          python tests/test_support_files_module.py
          python tests/test_desktop_ui_module.py
          python tests/frontend_asset_check.py

      - name: Build macOS DMG
        run: |
          chmod +x scripts/build_macos_dmg.sh
          PYTHON_BIN=python scripts/build_macos_dmg.sh

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/GoldMonitor-macOS.dmg
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate update manifest
        run: |
          python scripts/generate_release_manifest.py \
            --tag "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --release-dir release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GoldMonitor ${{ github.ref_name }}
          body_path: release/release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/GoldMonitorSetup.exe
            release/GoldMonitor-macOS.dmg
            release/version.json
