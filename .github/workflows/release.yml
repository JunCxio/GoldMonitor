name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt -c constraints/windows-py312.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Run checks
        shell: powershell
        run: python scripts/run_checks.py

      - name: Build Windows application
        shell: powershell
        run: pyinstaller --clean --noconfirm GoldMonitor.spec

      - name: Build Windows installer
        shell: powershell
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          & $iscc .\installer\GoldMonitor.iss

      - name: Upload Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: release/GoldMonitorSetup.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt -c constraints/macos-py312.txt

      - name: Run checks
        run: python scripts/run_checks.py

      - name: Build macOS DMG
        run: |
          chmod +x scripts/build_macos_dmg.sh
          PYTHON_BIN=python scripts/build_macos_dmg.sh

      - name: Upload macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: release/GoldMonitor-macOS.dmg
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate update manifest
        run: |
          python scripts/generate_release_manifest.py \
            --tag "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --release-dir release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: GoldMonitor ${{ github.ref_name }}
          body_path: release/release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/GoldMonitorSetup.exe
            release/GoldMonitor-macOS.dmg
            release/version.json

  verify-release:
    runs-on: ubuntu-latest
    needs:
      - publish-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify published release assets
        run: |
          python scripts/verify_release_assets.py \
            --tag "${{ github.ref_name }}" \
            --repository "${{ github.repository }}"
