name: 功能建议
description: 描述用户问题、使用场景和期望结果
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请从用户问题和使用场景开始，不要求先设计技术实现。不要提交 API Key、SMTP 授权码、Webhook URL、用户数据、可识别个人身份的本地路径信息或完整诊断数据。
  - type: textarea
    id: user-problem
    attributes:
      label: 用户问题
      description: 当前什么事情难以完成，或者容易出错？
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁会在什么情况下使用这项能力？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 完成后用户应获得什么可验证结果？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围边界
      description: 哪些行为不应包含在第一版中？
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
      description: 目前如何绕过或解决这个问题？
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 内容不包含 API Key、SMTP 授权码、Webhook URL、用户数据、可识别个人身份的本地路径信息或完整诊断数据。
          required: true
